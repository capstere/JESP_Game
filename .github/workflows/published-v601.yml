name: V6.0.1 published website acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/published-v601.yml, tests/published-v601.mjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jesp-published-v601
  cancel-in-progress: false
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify deployed file hashes and run a real task on the published site
        run: node tests/published-v601.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-v601-evidence
          path: published-v601-evidence/
          retention-days: 14

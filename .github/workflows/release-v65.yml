name: JESP 6.5 general agent support acceptance
on:
  push:
    branches: [feat/general-agent-support-v65]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jesp-v65-release
  cancel-in-progress: true
jobs:
  unit_and_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save exact source for review and reproducibility
        run: |
          mkdir -p candidate-source
          git archive HEAD | gzip > candidate-source/source.tar.gz
          git rev-parse HEAD > candidate-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v65-candidate-source
          path: candidate-source/
          retention-days: 7
      - name: Existing and new deterministic regressions (model responses simulated)
        run: node --test tests/agent-unit.mjs tests/reasoning-v51.mjs tests/cap-v51.mjs tests/progress-v511.mjs tests/quality-v52.mjs tests/snapshot-v52.mjs tests/protocol-recovery-v52.mjs tests/backend-v6.mjs tests/backend-hardening-v6.mjs tests/backend-escalation-v6.mjs tests/backend-budget-v6.mjs tests/backend-argument-guard-v6.mjs tests/final-review-v601.mjs tests/arguments-v601.mjs tests/controller-v601.mjs tests/verification-v610.mjs tests/requirements-v62.mjs tests/evidence-first-v64.mjs tests/reviewer-v641.mjs tests/live-stream-v63.mjs tests/stream-gateway-v63.mjs tests/agent-boost-v65.mjs tests/advice-slots-v65.mjs tests/stream-preview-v642.mjs
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Actual browser restart safety and preserved streaming behavior
        run: |
          node tests/boost-browser-v65.mjs
          node tests/stream-preview-browser-v642.mjs
          node tests/live-ui-v63.mjs
          node tests/browser-verification-v610.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v65-ui-evidence
          path: |
            boost-evidence/
            preview-evidence/
  real_agent:
    needs: unit_and_browser
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p boost-evidence
          git rev-parse HEAD > boost-evidence/tested-commit.txt
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Real anonymous interval repair, held-out cases and read-only specialist inference
        env:
          LIVE: '1'
        run: node tests/boost-browser-v65.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v65-real-agent-evidence
          path: boost-evidence/
          retention-days: 14

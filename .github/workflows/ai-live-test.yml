name: Real AI browser test
on:
  workflow_dispatch:
    inputs:
      live_url:
        description: Optional deployed URL; empty stages static files and also tests local model
        type: string
        required: false
permissions:
  contents: read
jobs:
  real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install extended browser dependencies
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/jesp-ai-browser
          cd /tmp/jesp-ai-browser
          npm init -y
          npm install --save-exact playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Run actual app with real anonymous API and optional local model
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          LIVE_URL: ${{ inputs.live_url || '' }}
        run: |
          cp tests/live-browser.mjs /tmp/jesp-ai-browser/live-browser.mjs
          cd /tmp/jesp-ai-browser
          node live-browser.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ai-browser-results
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7

name: Real AI browser test
on:
  push:
    branches: [fix/no-login-ai]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned inference engine and browser
        run: |
          mkdir -p /tmp/jesp-ai-test
          cd /tmp/jesp-ai-test
          npm init -y
          npm install --save-exact @wllama/wllama@3.12.0 playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Run real inference without API credentials
        run: |
          cd /tmp/jesp-ai-test
          cat > index.html <<'HTML'
          <!doctype html><html><body><script type="module">
          import {Wllama} from './node_modules/@wllama/wllama/esm/index.js';
          window.Wllama = Wllama;
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ai-http.log 2>&1 &
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER',m.type(),m.text().slice(0,1500)));
            page.on('pageerror',e=>console.log('PAGE ERROR',String(e)));
            await page.goto('http://127.0.0.1:8765/');
            await page.waitForFunction(()=>!!window.Wllama);
            const result=await page.evaluate(async()=>{
              const engine=new window.Wllama({default:'./node_modules/@wllama/wllama/esm/wasm/wllama.wasm'});
              await engine.loadModelFromUrl('https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf',{n_ctx:2048,n_threads:1,n_batch:128,n_gpu_layers:0,progressCallback:p=>console.log('DOWNLOAD',JSON.stringify(p))});
              const response=await engine.createChatCompletion({messages:[{role:'user',content:'What is 7 plus 5? Reply with only the number.'}],max_tokens:32,temperature:0,stream:false});
              await engine.exit();
              return response;
            });
            console.log('REAL_INFERENCE_RESULT',JSON.stringify(result));
            if (!/\b12\b/.test(result.choices?.[0]?.message?.content||'')) throw new Error('Expected real arithmetic answer 12');
            console.log('PASS: actual downloaded model generated 12 in browser; no API login or key');
          } finally { await browser.close(); }
          JS
          node test.mjs

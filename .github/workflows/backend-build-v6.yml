name: Backend v6 real build acceptance
on:
  push:
    branches: [feat/backend-v6]
    paths: [.github/workflows/backend-build-v6.yml, tools/upgrade_backend_v6.py, agents/backend.mjs]
  workflow_dispatch:
concurrency:
  group: jesp-v6-live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed candidate patch on test branch only
        run: |
          python3 tools/upgrade_backend_v6.py
          node --check agents/backend.mjs
          node --check agents/app.mjs
          node --test tests/agent-unit.mjs tests/reasoning-v51.mjs tests/cap-v51.mjs tests/progress-v511.mjs tests/quality-v52.mjs tests/snapshot-v52.mjs tests/protocol-recovery-v52.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents index.html tests/backend-live-v6.mjs
          if ! git diff --cached --quiet; then git commit -m 'Apply v6 backend candidate sources [skip ci]'; git push origin HEAD:feat/backend-v6; fi
      - name: Install pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Real deployed backend, generated FPS, independent gameplay assertions
        run: node tests/backend-live-v6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-v6-real-build
          path: backend-live-evidence/

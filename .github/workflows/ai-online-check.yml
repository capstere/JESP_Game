name: Published anonymous AI check
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-online-ai
  cancel-in-progress: true
jobs:
  published-online-ai:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium only
        run: |
          mkdir -p /tmp/jesp-online-check
          cd /tmp/jesp-online-check
          npm init -y
          npm install --save-exact playwright@latest
          npx playwright install chromium
      - name: Verify published website with actual anonymous responses
        env:
          SOURCE_ROOT: ${{ github.workspace }}
        run: |
          cp tests/live-online-check.mjs /tmp/jesp-online-check/test.mjs
          cd /tmp/jesp-online-check
          node test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-ai-evidence
          path: test-artifacts-online/
          retention-days: 7
          if-no-files-found: warn

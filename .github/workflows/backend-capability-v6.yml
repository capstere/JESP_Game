name: Anonymous backend capability v6
on:
  push:
    branches: [feat/backend-v6]
    paths: [.github/workflows/backend-capability-v6.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jesp-backend-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test documented anonymous models server-side
        run: |
          mkdir -p evidence
          cat > /tmp/probe.mjs <<'JS'
          import {writeFile} from 'node:fs/promises';
          const base='https://ai-gateway.kilo.ai/api/v1';
          const report={at:new Date().toISOString(),authenticated:false,models:[],results:[]};
          try {
            const r=await fetch(base+'/models',{signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw new Error('catalog HTTP '+r.status+' '+(await r.text()).slice(0,500));
            const data=await r.json();
            const free=(data.data||[]).filter(m=>(m.id?.endsWith(':free')||m.id==='kilo-auto/free')&&m.pricing&&['prompt','completion'].every(k=>m.pricing[k]!==undefined&&m.pricing[k]!==null&&String(m.pricing[k]).trim()!==''&&Number(m.pricing[k])===0));
            report.models=free.map(m=>({id:m.id,pricing:m.pricing,context_length:m.context_length,supported_parameters:m.supported_parameters}));
            const ranked=free.sort((a,b)=>score(b)-score(a));
            function score(m){return /glm-5/.test(m.id)?100:/minimax-m2/.test(m.id)?90:/qwen3.*coder|qwen3.*235/.test(m.id)?80:/deepseek/.test(m.id)?70:m.id==='kilo-auto/free'?20:0;}
            for(const m of ranked.slice(0,2)){
              const start=Date.now();
              try {
                const response=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:m.id,messages:[{role:'user',content:'A price starts at 100, rises by 25%, then falls by 20%. Someone says it ends 5% higher. Is that correct? Return JSON only with final_price, claim_correct, and a one-sentence explanation.'}],max_tokens:2048,stream:false}),signal:AbortSignal.timeout(100000)});
                const raw=await response.text();let d;try{d=JSON.parse(raw);}catch{d={error:raw.slice(0,300)}}
                report.results.push({requested:m.id,status:response.status,model:d.model,finish:d.choices?.[0]?.finish_reason,content:d.choices?.[0]?.message?.content,usage:d.usage,error:d.error,ms:Date.now()-start});
                if(response.status===429||response.status===401||response.status===403)break;
              }catch(e){report.results.push({requested:m.id,error:e.message,ms:Date.now()-start});}
            }
          }catch(e){report.error=e.message;}
          await writeFile('evidence/backend-probe.json',JSON.stringify(report,null,2));
          console.log('PROBE_RESULT '+JSON.stringify(report));
          if(!report.results.some(x=>x.status===200&&x.content))process.exitCode=1;
          JS
          node /tmp/probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-capability-v6
          path: evidence/

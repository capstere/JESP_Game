name: V6.1 independent verification and real acceptance
on:
  push:
    branches: [fix/verified-agent-v610]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jesp-release-v610
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-agent-v610
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply locally verified source transformation once
        run: |
          if ! grep -q "VERSION='6.1.0'" agents/core.mjs; then python3 tools/prepare_v610.py; fi
          node --test tests/agent-unit.mjs tests/reasoning-v51.mjs tests/cap-v51.mjs tests/progress-v511.mjs tests/quality-v52.mjs tests/snapshot-v52.mjs tests/protocol-recovery-v52.mjs tests/backend-v6.mjs tests/backend-hardening-v6.mjs tests/backend-escalation-v6.mjs tests/backend-budget-v6.mjs tests/backend-argument-guard-v6.mjs tests/final-review-v601.mjs tests/arguments-v601.mjs tests/controller-v601.mjs tests/verification-v610.mjs
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents index.html
          if ! git diff --cached --quiet; then git commit -m 'Integrate independent executable verification before completion [skip ci]'; git push origin HEAD:fix/verified-agent-v610; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  live:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [optimization, fps]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/candidate-commit.txt
          git archive --format=tar HEAD agents backend tests tools index.html README_AI.md AI_TEST_RESULTS.json .github > release-evidence/source.tar
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Unchanged independent live acceptance
        env:
          CASE: ${{ matrix.case }}
        run: |
          if [ "$CASE" = optimization ]; then node tests/agent-optimization-v6.mjs; else node tests/backend-hardened-live-v6.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v610-real-${{ matrix.case }}
          path: |
            release-evidence/
            optimization-agent-evidence/
            backend-hardened-evidence/
          retention-days: 14
